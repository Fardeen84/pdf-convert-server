services:
  convert:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"          # put nginx/Caddy with HTTPS in front of this
    mem_limit: 2g            # ~500 MB per concurrent LibreOffice job
    read_only: true
    tmpfs:
      - /tmp:size=1g
    security_opt:
      - no-new-privileges:true
